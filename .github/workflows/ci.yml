name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Offline smoke test
        shell: bash
        run: |
          python -c "import numpy as np; from rtvc.wavio import write_wav; write_wav('in.wav', 0.3*np.sin(2*np.pi*200*np.arange(48000)/48000), 48000)"
          rtvc convert in.wav out.wav --semitones 4
