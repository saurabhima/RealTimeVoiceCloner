<text x="1040" y="386" font-size="11" text-anchor="start" fill="#111827">3 Ring1 R</text>
<text x="1040" y="404" font-size="11" text-anchor="start" fill="#111827">4 Tip L</text>
<text x="1095" y="424" font-size="9" text-anchor="middle" fill="#6b7280">(call audio out; optional J5)</text>
<rect x="30" y="500" width="1140" height="235" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
<text x="48" y="524" font-size="15" text-anchor="start" fill="#111827" font-weight="700">Design notes</text>
<text x="48" y="550" font-size="12" text-anchor="start" fill="#111827">•  Pi USB port to J1 by cable; module gets 5 V and USB data from J1. GPIO header gives mechanical mounting and common ground only.</text>
<text x="48" y="574" font-size="12" text-anchor="start" fill="#111827">•  Not an official HAT: no ID EEPROM (the Pi will not auto-load anything, and none is needed). Add a 24C32 + jumper if you want HAT compliance.</text>
<text x="48" y="598" font-size="12" text-anchor="start" fill="#111827">•  U1 pin order is ASSUMED. Different CM108 modules use different pinouts: confirm VBUS / D− / D+ / GND / HPL / HPR / AGND and edit the netlist or footprint.</text>
<text x="48" y="622" font-size="12" text-anchor="start" fill="#111827">•  Layout: keep D+/D− short and together, ground pour on the bottom layer, put the attenuator and J2 away from the USB traces and cable.</text>
<text x="48" y="646" font-size="12" text-anchor="start" fill="#111827">•  Attenuation about −41 dB flat 300 Hz–8 kHz (calculated). Not built or tested. Check with a multimeter, then start at very low volume.</text>
<text x="48" y="670" font-size="12" text-anchor="start" fill="#111827">•  Phone mic wiring: Sleeve = MIC, Ring2 = GND, Ring1 = R, Tip = L (CTIA). If the far end hears nothing, try an OMTP/CTIA swap adapter.</text>
<text x="48" y="694" font-size="12" text-anchor="start" fill="#111827">•  The USB microphone plugs into a second Pi USB port. rtvc: input_device = &lt;mic name&gt;, output_device = &lt;CM108 module name&gt;.</text>
</svg>