<text x="38" y="636" font-size="15" text-anchor="start" fill="#111827" font-weight="700">Design notes</text>
<text x="38" y="666" font-size="12" text-anchor="start" fill="#111827">•  Connect to the Pi with a USB-C to USB-A cable into a Pi USB-A port. The Pi's own USB-C port is power-input only and cannot host this module.</text>
<text x="38" y="704" font-size="12" text-anchor="start" fill="#111827">•  CC1/CC2 each get 5.1 kΩ to GND (USB device). D+/D− are tied across both connector rows so the plug works either way up. No USB-PD.</text>
<text x="38" y="742" font-size="12" text-anchor="start" fill="#111827">•  Source of values: U1 pins from the CM108B datasheet rev 1.11; supply splitting, regulator caps, USB 39 Ω + 100 pF, output 39 Ω + 100 pF and PDSW cap from C-Media Application Notes v1.5 (sections 3.2-3.5, 5.6 table).</text>
<text x="38" y="780" font-size="12" text-anchor="start" fill="#111827">•  DREG18 = 1 µF, DREG33 = 100 nF, AREG36 = 10 µF (the earlier 4.7 µF guess was wrong). The VREF (pin 26) cap is read from a figure whose lower pin numbers are off by one vs the datasheet: confirm it.</text>
<text x="38" y="818" font-size="12" text-anchor="start" fill="#111827">•  Headphone out (normal mode): LOL/LOR are biased at 1.75 V, so DC-block caps are needed. The reference uses 100 µF for 32 Ω headphones; 10 µF is enough into this 10 kΩ divider (1.6 Hz corner). LOBS stays open.</text>
<text x="38" y="856" font-size="12" text-anchor="start" fill="#111827">•  Attenuation about −41 dB (calculated): roughly 9 mV rms at full scale. 39 Ω series resistors are negligible here. Not built or tested: check with a multimeter, start at very low volume.</text>
<text x="38" y="894" font-size="12" text-anchor="start" fill="#111827">•  Layout (app note 4): USB pair 90 Ω differential, short, no stubs over 200 mil; bypass caps right at the supply pins; solid ground pour. 0.5 mm LQFP-48 needs hot-air or an assembly service.</text>
<text x="38" y="932" font-size="12" text-anchor="start" fill="#111827">•  Phone side: 4-pole male-male TRRS (CTIA) cable from J2 to the phone. If the far end hears nothing, try an OMTP/CTIA swap adapter. The USB mic stays on a separate Pi USB port.</text>
</svg>