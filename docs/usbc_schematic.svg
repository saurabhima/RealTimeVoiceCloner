<rect x="20" y="495" width="1160" height="285" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
<text x="38" y="520" font-size="15" text-anchor="start" fill="#111827" font-weight="700">Design notes</text>
<text x="38" y="548" font-size="12" text-anchor="start" fill="#111827">•  Connect to the Pi with a USB-C to USB-A cable into a Pi USB-A port. The Pi's own USB-C port is power-input only and cannot host this module.</text>
<text x="38" y="577" font-size="12" text-anchor="start" fill="#111827">•  CC1/CC2 each get 5.1 kΩ to GND (USB device). D+/D− are tied across both connector rows so the plug works either way up. No USB-PD.</text>
<text x="38" y="606" font-size="12" text-anchor="start" fill="#111827">•  U1 pin numbers verified against the C-Media CM108B datasheet rev 1.11 (section 4.1). LOL/LOR are line outs biased at 1.75 V DC, hence C6/C7 (+ toward U1). Full scale 0.995 Vrms into 10 kΩ.</text>
<text x="38" y="635" font-size="12" text-anchor="start" fill="#111827">•  Straps: MODE = GND (headset mode: playback + record), PWRSEL = GND (500 mA bus-powered), MSEL = GND (mixer off). Volume/mute/EEPROM pins left open (internal pull-ups, default USB descriptors).</text>
<text x="38" y="664" font-size="12" text-anchor="start" fill="#111827">•  OPEN ITEMS (the datasheet is silent): values of the DREG18/DREG33/AREG36/VREF capacitors (4.7 µF assumed), any external USB D+ pull-up or series resistors (none added), role of LOBS (left open). MICIN, VBIAS and the I2S/GPIO/SPDIF pins are unused.</text>
<text x="38" y="693" font-size="12" text-anchor="start" fill="#111827">•  Attenuation about −41 dB (calculated): about 9 mV rms at full-scale output. Not built or tested: check with a multimeter, start at very low volume.</text>
<text x="38" y="722" font-size="12" text-anchor="start" fill="#111827">•  Phone side: 4-pole male-male TRRS (CTIA) cable from J2 to the phone. If the far end hears nothing, try an OMTP/CTIA swap adapter.</text>
<text x="38" y="751" font-size="12" text-anchor="start" fill="#111827">•  Software: rtvc run with output_device = the module (see rtvc devices). The USB microphone stays on a separate Pi USB port.</text>
</svg>