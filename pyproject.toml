[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-voice-cloner"
version = "0.1.0"
description = "Real-time voice conversion for Raspberry Pi: USB mic in, 3.5mm jack out to a phone call."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "sounddevice>=0.4.6", "soxr>=0.3.7"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8"]

[project.scripts]
rtvc = "rtvc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
